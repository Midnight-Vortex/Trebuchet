name: Build

# Every push and pull request: build the solution and run both regression harnesses on Windows.
# Started by hand (Actions tab → Build → Run workflow) or by a "v*" tag it also builds the installer.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      installer:
        description: "Also build the installer"
        type: boolean
        default: true
      release:
        description: "Publish it as GitHub release v<VERSION> (public download)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Same overrides as in the README: no single-file/self-contained publish for checks.
  CHECK_PROPS: -c Release -p:SelfContained=false -p:PublishSingleFile=false

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build Trebuchet.sln -m:1 ${{ env.CHECK_PROPS }}

      # The harnesses are not part of the solution, dotnet run builds them.
      - name: Console hotkey, directory copy and server checks
        run: dotnet run --project Tests/ConsoleHotkeyChecks/ConsoleHotkeyChecks.csproj ${{ env.CHECK_PROPS }}

      - name: Mod list and profile menu checks
        run: dotnet run --project Tests/ModListDisplayChecks/ModListDisplayChecks.csproj ${{ env.CHECK_PROPS }}

      - name: Server console checks
        run: dotnet run --project Tests/ModListDisplayChecks/ModListDisplayChecks.csproj ${{ env.CHECK_PROPS }} -- --console-checks

  installer:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.installer)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      # Creating the GitHub release of a "v*" tag.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Trebuchet and Boulder (win-x64, self-contained)
        run: |
          dotnet publish Trebuchet/Trebuchet.csproj -c Release -r win-x64 --self-contained true
          dotnet publish Boulder/Boulder.csproj -c Release -r win-x64 --self-contained true

      - name: Compile installer
        run: .tools\InnoSetup6\ISCC.exe build_setup.iss

      # One file name for every version: .../releases/latest/download/Trebuchet-Setup.exe always is the newest.
      - name: Name the setup
        shell: pwsh
        run: Copy-Item (Get-ChildItem Deploy -Filter *.exe | Select-Object -First 1).FullName Deploy/Trebuchet-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: trebuchet-setup
          path: Deploy/Trebuchet-Setup.exe
          if-no-files-found: error

      # A "v*" tag, or a manual run with "release", publishes the setup as a GitHub release: anyone can download it,
      # without a GitHub login. A manual run creates the tag v<VERSION> on the built commit.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v" + (Get-Content VERSION -Raw).Trim() }
          gh release create $tag Deploy/Trebuchet-Setup.exe `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Trebuchet $tag" `
            --notes "Windows setup: download Trebuchet-Setup.exe and run it." `
            --latest
